<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmy Viajes Perú | Experiencias inolvidables</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #003399; --rojo: #e60000; --dorado: #c5a059; --blanco: #ffffff; --gris: #f4f7f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; color: #333; line-height: 1.6; }
        
        /* Grid Dinámico */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 20px; }
        
        /* Tarjeta optimizada */
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-10px); }
        .card-img-container { width: 100%; height: 220px; overflow: hidden; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 20px; flex-grow: 1; }
        
        .btn-card { display: block; background: var(--azul); color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 10px; font-weight: 700; margin-top: 15px; }
        .btn-card:hover { background: var(--rojo); }
    </style>
</head>
<body>

<section id="full-days" style="padding: 50px 8%;">
    <div class="section-header" style="text-align: center; margin-bottom: 40px;">
        <h2>Nuestros Destinos Destacados</h2>
    </div>
    
    <div class="grid">
        <div class="card">
            <div class="card-img-container">
                <img src="https://images.unsplash.com/photo-1544605910-a29285703f83?q=80&w=800&auto=format&fit=crop" alt="Huacachina">
            </div>
            <div class="card-body">
                <h3>Paracas & Ica Premium</h3>
                <ul>
                    <li><i class="fas fa-check" style="color:var(--rojo)"></i> Islas Ballestas + Huacachina</li>
                    <li><i class="fas fa-check" style="color:var(--rojo)"></i> Buggies y Sandboarding</li>
                </ul>
                <a href="#" class="btn-card">VER ITINERARIO</a>
            </div>
        </div>

        <div class="card">
            <div class="card-img-container">
                <img src="https://images.unsplash.com/photo-1509281373149-e957c6296406?auto=format&fit=crop&w=800" alt="Dromedarios">
            </div>
            <div class="card-body">
                <h3>Dromedarius & Desierto</h3>
                <ul>
                    <li><i class="fas fa-check" style="color:var(--rojo)"></i> Paseo en Dromedarios</li>
                    <li><i class="fas fa-check" style="color:var(--rojo)"></i> Piscina en el Desierto</li>
                </ul>
                <a href="#" class="btn-card">VER DETALLES</a>
            </div>
        </div>

        <div class="card">
            <div class="card-img-container">
                <img src="https://images.unsplash.com/photo-1596436889106-be35e843f974?auto=format&fit=crop&w=800" alt="Antioquia">
            </div>
            <div class="card-body">
                <h3>Antioquia: Colores</h3>
                <ul>
                    <li><i class="fas fa-check" style="color:var(--rojo)"></i> Cieneguilla</li>
                    <li><i class="fas fa-check" style="color:var(--rojo)"></i> Guía Certificado</li>
                </ul>
                <a href="#" class="btn-card">VER DISPONIBILIDAD</a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
